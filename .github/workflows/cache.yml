name: Cache Stuff

on: [push, workflow_dispatch]

env:
  NIX_HOSTNAME: "Ainz-NIX"
  NIXOS_ATTRS_LIST: >
    programs.hyprland.package
    programs.hyprland.portalPackage
    services.ananicy.package
    programs.appimage.package
    boot.kernelPackages.kernel
  CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
  CACHIX_CACHE_NAME: "johnrtitor"
  REQUIRED_PACKAGES: >
    cachix
    jq
    findutils

jobs:
  cache:
    name: Cache Stuff
    runs-on: ubuntu-latest

    steps:
      - name: prepare /nix
        shell: bash
        env:
          CLEAN: "true"
          BTRFS: "true"
        run: |
          curl -o prepare.sh https://raw.githubusercontent.com/JohnRTitor/nixpkgs-review-gha/refs/heads/main/helpers/prepare.sh
          bash prepare.sh

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            auto-optimise-store = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
            accept-flake-config = true
            build-dir = /nix/var

      - uses: actions/checkout@v4

      - name: Install required packages
        run: |
          for PKG in $REQUIRED_PACKAGES; do
            nix profile install nixpkgs#$PKG
          done

      - name: Build Packages and push to Cachix
        run: |
          # Build packages defined in this flake
          nix flake show --json | jq  '.packages."x86_64-linux"|keys[]' | xargs -I {} sh -c '
            nix build .#{} --print-out-paths | xargs cachix push $CACHIX_CACHE_NAME
          '

          # Build NixOS configuration attributes
          for ATTR in $NIXOS_ATTRS_LIST; do
            nix build .#nixosConfigurations.$NIX_HOSTNAME.config.$ATTR --print-out-paths | cachix push $CACHIX_CACHE_NAME
          done
