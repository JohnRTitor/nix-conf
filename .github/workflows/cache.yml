name: Cache-Stuff
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - 'wallpapers/**'
  workflow_dispatch:
  workflow_run:
    workflows: [update-flake-lock]
    types:
      - completed

permissions:
  contents: read

env:
  CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
  CACHIX_CACHE_NAME: "johnrtitor"
  REQUIRED_PACKAGES: >
    cachix
    jq
    findutils
    yq-go

jobs:
  prepare-matrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
      has_targets: ${{ steps.set-matrix.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v7
      
      - name: setup nix
        uses: ./.github/actions/setup-nix

      - name: Install required tools
        run: nix profile install nixpkgs#yq-go nixpkgs#jq

      - name: Filter Matrix Targets
        id: set-matrix
        run: |
          # Read all targets from TOML
          TARGETS_JSON=$(yq -o=json '.targets' .github/cache-targets.toml | jq -c .)
          
          # Filter matrix to only include targets missing from Cachix
          chmod +x .github/scripts/filter-matrix.sh
          ./.github/scripts/filter-matrix.sh "$TARGETS_JSON" "${{ env.CACHIX_CACHE_NAME }}"

  build:
    name: Build ${{ matrix.target.name || matrix.target.group }}
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    
    # We use fail-fast: false so one failing target does not cancel the rest of the builds.
    # Note on parallel Cachix pushes: 
    # Cachix safely handles concurrent uploads. If multiple jobs build the same shared 
    # dependencies, Cachix will deduplicate them gracefully. However, running fully parallel jobs
    # can consume a lot of GitHub Actions minutes if many derivations share long-building dependencies
    # that haven't been cached yet.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-matrix.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
      
      - name: setup nix
        uses: ./.github/actions/setup-nix

      - uses: actions/checkout@v7

      - name: Install required packages
        run: |
          for PKG in $REQUIRED_PACKAGES; do
            nix profile install nixpkgs#$PKG
          done

      - name: Build target and push to Cachix
        run: |
          chmod +x ./.github/scripts/build-and-cache.sh
          # Pass the JSON representation of the matrix target as the single argument
          ./.github/scripts/build-and-cache.sh '${{ toJSON(matrix.target) }}'
          
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Include the job index for uniqueness, plus group and name for readability
          name: build-logs-${{ strategy.job-index }}-${{ matrix.target.group }}-${{ matrix.target.name || matrix.target.user || 'all' }}
          path: |
            build.log
            errors.log
            success.txt
            failures.txt
            logs/
          retention-days: 7
          if-no-files-found: ignore
