name: Cache Stuff
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: [update-flake-lock]
    types:
      - completed

permissions:
  contents: read

env:
  NIX_HOSTNAME: "Ainz-NIX"
  NIXOS_ATTRS_LIST: >
    programs.hyprland.package
    programs.hyprland.portalPackage
    services.ananicy.package
    programs.appimage.package
    boot.kernelPackages.kernel
  NIXOS_PKGS_LIST: >
    zed-editor_git
    scx.full
  CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
  CACHIX_CACHE_NAME: "johnrtitor"
  REQUIRED_PACKAGES: >
    cachix
    jq
    findutils

jobs:
  cache:
    name: Cache Stuff
    runs-on: ubuntu-latest

    steps:
      - name: prepare /nix
        shell: bash
        env:
          CLEAN: "true"
          BTRFS: "true"
        run: |
          curl -o prepare.sh https://raw.githubusercontent.com/JohnRTitor/nixpkgs-review-gha/refs/heads/main/helpers/prepare.sh
          bash prepare.sh

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            auto-optimise-store = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
            accept-flake-config = true
            build-dir = /nix/var

      - uses: actions/checkout@v4

      - name: Install required packages
        run: |
          for PKG in $REQUIRED_PACKAGES; do
            nix profile install nixpkgs#$PKG
          done

      - name: Build Packages and push to Cachix
        shell: bash
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          echo "::notice::Fetching list of packages to build"

          # Get a list of packages defined in this flake
          PKGS_LIST=$(nix flake show --json | jq -r '.packages."x86_64-linux" | keys | join(" ")')

          # Add NixOS configuration attributes
          for ATTR in $NIXOS_ATTRS_LIST; do
            PKGS_LIST+=" nixosConfigurations.$NIX_HOSTNAME.config.$ATTR"
          done

          for PKG in $NIXOS_PKGS_LIST; do
            PKGS_LIST+=" nixosConfigurations.$NIX_HOSTNAME.pkgs.$PKG"
          done

          echo "::notice::Starting package build and cache push"
          for PKG in $PKGS_LIST; do
            echo "::notice::Building package $PKG"
            nix build .#$PKG --impure --print-out-paths --print-build-logs | cachix push $CACHIX_CACHE_NAME
          done
