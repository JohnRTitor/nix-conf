name: Cache-Stuff
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: [update-flake-lock]
    types:
      - completed

permissions:
  contents: read

env:
  CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
  CACHIX_CACHE_NAME: "johnrtitor"
  REQUIRED_PACKAGES: >
    cachix
    jq
    findutils

jobs:
  prepare-matrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate Matrix from cache.json
        id: set-matrix
        run: |
          # Read the targets array from cache.json and output it as a single JSON string
          TARGETS=$(jq -c '.targets' cache.json)
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target.name || matrix.target.group }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    
    # We use fail-fast: false so one failing target does not cancel the rest of the builds.
    # Note on parallel Cachix pushes: 
    # Cachix safely handles concurrent uploads. If multiple jobs build the same shared 
    # dependencies, Cachix will deduplicate them gracefully. However, running fully parallel jobs
    # can consume a lot of GitHub Actions minutes if many derivations share long-building dependencies
    # that haven't been cached yet.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-matrix.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
      
      - name: setup nix
        uses: ./.github/actions/setup-nix

      - uses: actions/checkout@v7

      - name: Install required packages
        run: |
          for PKG in $REQUIRED_PACKAGES; do
            nix profile install nixpkgs#$PKG
          done

      - name: Build target and push to Cachix
        run: |
          chmod +x ./.github/scripts/build-and-cache.sh
          # Pass the JSON representation of the matrix target as the single argument
          ./.github/scripts/build-and-cache.sh '${{ toJSON(matrix.target) }}'
          
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Use the job index to ensure unique artifact names per matrix job
          name: build-logs-${{ strategy.job-index }}
          path: |
            build.log
            errors.log
            success.txt
            failures.txt
          retention-days: 7
          if-no-files-found: ignore
